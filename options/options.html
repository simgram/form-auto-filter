<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約フォーム 入力アシスタント - 設定</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; color: #1f2937; background: #f3f4f6; }
    * { box-sizing: border-box; }
    body { max-width: 850px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 24px; }
    h2 { margin-top: 0; font-size: 18px; }
    .card { margin: 18px 0; padding: 20px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 10px; align-items: end; }
    button { padding: 9px 13px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #475569; }
    button.danger { background: #b91c1c; }
    .actions { display: flex; gap: 8px; }
    .saved-list { display: grid; gap: 10px; margin-top: 16px; }
    .item { display: grid; grid-template-columns: 1fr 1.5fr 1.5fr auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .item span { overflow-wrap: anywhere; }
    .hint { color: #64748b; font-size: 13px; }
    #notice { min-height: 1.5em; color: #166534; }
    @media (max-width: 620px) { .row, .item { grid-template-columns: 1fr; } .actions { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <h1>予約フォーム 入力アシスタント</h1>

  <section class="card">
    <h2>ローカル保存について</h2>
    <p class="hint">入力値はこのブラウザーの chrome.storage.local に保存されます。ページ表示時やフォーム項目の追加時に、ラベル名とドメイン・パスが一致する空欄へ自動で復元します。URLのクエリパラメーターは照合しません。外部APIには送信しません。</p>
  </section>

  <section class="card" aria-labelledby="data-title">
    <h2 id="data-title">保存データ</h2>
    <form id="item-form">
      <div class="row">
        <div><label for="item-label">ラベル名</label><input id="item-label" type="text" maxlength="100" required placeholder="例: 氏名"></div>
        <div><label for="item-url">対象URL</label><input id="item-url" type="text" required placeholder="https://example.com/booking"></div>
        <div><label for="item-value">入力値</label><input id="item-value" type="text" required placeholder="例: 山田太郎"></div>
        <div class="actions"><button id="submit-item" type="submit">追加</button><button id="cancel-edit" type="button" class="secondary" hidden>編集を中止</button></div>
      </div>
    </form>
    <div id="saved-list" class="saved-list" aria-live="polite"></div>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
